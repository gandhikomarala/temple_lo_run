<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>RELIC RUN — 3D Endless Adventure</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-select: none;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    }

    body, html {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #020617;
      color: #f8fafc;
    }

    #game-canvas {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      display: block;
      z-index: 1;
    }

    /* HUD OVERLAY */
    #hud-overlay {
      position: absolute;
      inset: 0;
      z-index: 10;
      pointer-events: none;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      padding: 20px;
    }

    .hud-top-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .hud-stat-badge {
      background: rgba(15, 23, 42, 0.75);
      backdrop-filter: blur(12px);
      padding: 8px 18px;
      border-radius: 20px;
      border: 1.5px solid rgba(251, 191, 36, 0.4);
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 16px;
      font-weight: 900;
      color: #facc15;
      box-shadow: 0 4px 15px rgba(0,0,0,0.5);
    }

    .hud-distance-badge {
      background: rgba(15, 23, 42, 0.75);
      backdrop-filter: blur(12px);
      padding: 8px 20px;
      border-radius: 20px;
      border: 1.5px solid rgba(56, 189, 248, 0.4);
      font-size: 18px;
      font-weight: 900;
      color: #38bdf8;
      box-shadow: 0 4px 15px rgba(0,0,0,0.5);
    }

    /* CONTROLS ONSCREEN (MOBILE & DESKTOP) */
    #onscreen-controls {
      position: absolute;
      bottom: 24px;
      left: 50%;
      transform: translateX(-50%);
      display: flex;
      gap: 12px;
      pointer-events: auto;
    }

    .ctrl-btn {
      width: 56px;
      height: 56px;
      background: rgba(30, 41, 59, 0.85);
      backdrop-filter: blur(10px);
      border: 2px solid rgba(56, 189, 248, 0.4);
      border-radius: 16px;
      color: #38bdf8;
      font-size: 20px;
      font-weight: 900;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      box-shadow: 0 6px 18px rgba(0,0,0,0.4);
      transition: transform 0.1s;
    }

    .ctrl-btn:active {
      transform: scale(0.9);
      background: #38bdf8;
      color: #0f172a;
    }

    /* GAME OVER & MENU MODAL */
    .game-modal {
      position: absolute;
      inset: 0;
      z-index: 50;
      background: rgba(15, 23, 42, 0.92);
      backdrop-filter: blur(16px);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 24px;
      text-align: center;
    }

    .modal-title {
      font-size: 38px;
      font-weight: 900;
      color: #f59e0b;
      letter-spacing: 2px;
      text-shadow: 0 0 25px rgba(245, 158, 11, 0.6);
    }

    .btn-play-primary {
      margin-top: 24px;
      background: linear-gradient(135deg, #f59e0b 0%, #d97706 100%);
      border: none;
      padding: 16px 48px;
      border-radius: 32px;
      color: #fff;
      font-size: 18px;
      font-weight: 900;
      cursor: pointer;
      box-shadow: 0 8px 30px rgba(245, 158, 11, 0.6);
      transition: transform 0.15s;
    }

    .btn-play-primary:hover { transform: scale(1.06); }
    .btn-play-primary:active { transform: scale(0.95); }
  </style>
</head>
<body>

<canvas id="game-canvas"></canvas>

<!-- HUD LAYER -->
<div id="hud-overlay">
  <div class="hud-top-bar">
    <div class="hud-stat-badge">🪙 <span id="lbl-coins">0</span></div>
    <div class="hud-distance-badge"><span id="lbl-distance">0</span> m</div>
    <div class="hud-stat-badge" style="border-color:#a855f7; color:#c084fc">✨ <span id="lbl-score">0</span></div>
  </div>

  <!-- ON-SCREEN CONTROLS -->
  <div id="onscreen-controls">
    <div class="ctrl-btn" id="btn-left">◀</div>
    <div class="ctrl-btn" id="btn-jump">▲</div>
    <div class="ctrl-btn" id="btn-slide">▼</div>
    <div class="ctrl-btn" id="btn-right">▶</div>
  </div>
</div>

<!-- START & GAME OVER SCREEN -->
<div class="game-modal" id="start-modal">
  <h1 class="modal-title">🗿 RELIC RUN</h1>
  <p style="color:#94a3b8; font-size:14px; margin-top:8px; max-width:320px;">
    Escape the collapsed ancient temple! Dodge deadly stone pillars, slide under low traps, jump over broken gaps, and outrun <b>The Warden</b>!
  </p>
  <div style="margin-top:16px; font-size:13px; color:#38bdf8; font-weight:700;">
    Controls: A/D or ◀/▶ (Lanes) • W/▲ (Jump) • S/▼ (Slide)
  </div>
  <button class="btn-play-primary" id="btn-start-game">START RUN</button>
</div>

<!-- SOUND SYNTHESIZER -->
<script>
class RelicAudio {
  constructor() { this.ctx = null; }
  init() { if (!this.ctx) this.ctx = new (window.AudioContext || window.webkitAudioContext)(); }
  play(f, d = 0.2, type = "sine", gain = 0.2) {
    try {
      this.init();
      const osc = this.ctx.createOscillator();
      const g = this.ctx.createGain();
      osc.type = type;
      osc.frequency.setValueAtTime(f, this.ctx.currentTime);
      g.gain.setValueAtTime(gain, this.ctx.currentTime);
      g.gain.exponentialRampToValueAtTime(0.001, this.ctx.currentTime + d);
      osc.connect(g);
      g.connect(this.ctx.destination);
      osc.start();
      osc.stop(this.ctx.currentTime + d);
    } catch(e) {}
  }
}
const sfx = new RelicAudio();
</script>

<!-- 3D ENDLESS RUNNER ENGINE -->
<script>
class RelicRunGame {
  constructor() {
    this.canvas = document.getElementById("game-canvas");
    this.lanes = [-3.0, 0.0, 3.0];
    this.currentLaneIdx = 1; // Center
    this.targetX = 0;
    this.playerX = 0;
    this.playerY = 1.0;
    this.playerZ = 0;
    this.speed = 22.0;

    this.isJumping = false;
    this.jumpY = 0;
    this.jumpVel = 0;

    this.isSliding = false;
    this.slideTime = 0;

    this.distance = 0;
    this.coins = 0;
    this.score = 0;
    this.isPlaying = false;

    this.trackTiles = [];
    this.obstacles = [];
    this.coinObjects = [];

    this.initThree();
    this.bindControls();
  }

  initThree() {
    this.scene = new THREE.Scene();
    this.scene.background = new THREE.Color(0x0f172a);
    this.scene.fog = new THREE.FogExp2(0x0f172a, 0.015);

    this.camera = new THREE.PerspectiveCamera(65, window.innerWidth / window.innerHeight, 0.1, 500);
    this.renderer = new THREE.WebGLRenderer({ canvas: this.canvas, antialias: true });
    this.renderer.setSize(window.innerWidth, window.innerHeight);
    this.renderer.shadowMap.enabled = true;

    // Lights
    const hemiLight = new THREE.HemisphereLight(0xffffff, 0x334155, 0.8);
    this.scene.add(hemiLight);

    const dirLight = new THREE.DirectionalLight(0xf59e0b, 1.2);
    dirLight.position.set(20, 40, 20);
    dirLight.castShadow = true;
    this.scene.add(dirLight);

    // Player Model (Explorer)
    this.playerGroup = new THREE.Group();
    const bodyGeo = new THREE.BoxGeometry(0.8, 1.4, 0.6);
    const bodyMat = new THREE.MeshLambertMaterial({ color: 0xd97706 });
    this.bodyMesh = new THREE.Mesh(bodyGeo, bodyMat);
    this.bodyMesh.position.y = 0.7;
    this.bodyMesh.castShadow = true;
    this.playerGroup.add(this.bodyMesh);

    // Explorer Relic Backpack
    const packGeo = new THREE.BoxGeometry(0.5, 0.6, 0.3);
    const packMat = new THREE.MeshLambertMaterial({ color: 0x38bdf8 });
    const pack = new THREE.Mesh(packGeo, packMat);
    pack.position.set(0, 0.8, -0.4);
    this.playerGroup.add(pack);

    this.scene.add(this.playerGroup);

    // The Warden Chaser
    const wardenGeo = new THREE.BoxGeometry(1.4, 2.4, 1.0);
    const wardenMat = new THREE.MeshLambertMaterial({ color: 0x7f1d1d });
    this.wardenMesh = new THREE.Mesh(wardenGeo, wardenMat);
    this.wardenMesh.position.set(0, 1.2, -12);
    this.scene.add(this.wardenMesh);

    // Generate initial track
    for (let i = 0; i < 15; i++) {
      this.spawnTrackTile(i * 30);
    }

    window.addEventListener("resize", () => {
      this.camera.aspect = window.innerWidth / window.innerHeight;
      this.camera.updateProjectionMatrix();
      this.renderer.setSize(window.innerWidth, window.innerHeight);
    });
  }

  spawnTrackTile(zPos) {
    const tileGeo = new THREE.BoxGeometry(9.0, 0.4, 30.0);
    const tileMat = new THREE.MeshLambertMaterial({ color: 0x334155 });
    const tile = new THREE.Mesh(tileGeo, tileMat);
    tile.position.set(0, 0, zPos);
    tile.receiveShadow = true;
    this.scene.add(tile);
    this.trackTiles.push(tile);

    // Spawn Obstacles & Coins (if past starting safe zone)
    if (zPos > 40) {
      if (Math.random() < 0.7) {
        const lane = this.lanes[Math.floor(Math.random() * 3)];
        const obsGeo = new THREE.BoxGeometry(2.0, 1.8, 0.8);
        const obsMat = new THREE.MeshLambertMaterial({ color: 0xef4444 });
        const obs = new THREE.Mesh(obsGeo, obsMat);
        obs.position.set(lane, 0.9, zPos + (Math.random() - 0.5) * 10);
        obs.castShadow = true;
        this.scene.add(obs);
        this.obstacles.push(obs);
      }

      // Coins in line
      const coinLane = this.lanes[Math.floor(Math.random() * 3)];
      for (let c = 0; c < 3; c++) {
        const coinGeo = new THREE.CylinderGeometry(0.35, 0.35, 0.1, 12);
        const coinMat = new THREE.MeshLambertMaterial({ color: 0xfacc15 });
        const coin = new THREE.Mesh(coinGeo, coinMat);
        coin.rotation.x = Math.PI / 2;
        coin.position.set(coinLane, 0.8, zPos + c * 3 - 5);
        this.scene.add(coin);
        this.coinObjects.push(coin);
      }
    }
  }

  bindControls() {
    const left = () => { if (this.currentLaneIdx > 0) { this.currentLaneIdx--; sfx.play(400, 0.1); } };
    const right = () => { if (this.currentLaneIdx < 2) { this.currentLaneIdx++; sfx.play(400, 0.1); } };
    const jump = () => {
      if (!this.isJumping && !this.isSliding) {
        this.isJumping = true;
        this.jumpVel = 14.0;
        sfx.play(550, 0.15, "triangle");
      }
    };
    const slide = () => {
      if (!this.isSliding && !this.isJumping) {
        this.isSliding = true;
        this.slideTime = 0.6;
        sfx.play(300, 0.15, "sawtooth");
      }
    };

    window.addEventListener("keydown", (e) => {
      if (!this.isPlaying) return;
      if (e.key === "ArrowLeft" || e.key === "a") left();
      if (e.key === "ArrowRight" || e.key === "d") right();
      if (e.key === "ArrowUp" || e.key === "w" || e.key === " ") jump();
      if (e.key === "ArrowDown" || e.key === "s") slide();
    });

    document.getElementById("btn-left").onclick = left;
    document.getElementById("btn-right").onclick = right;
    document.getElementById("btn-jump").onclick = jump;
    document.getElementById("btn-slide").onclick = slide;

    document.getElementById("btn-start-game").onclick = () => {
      document.getElementById("start-modal").style.display = "none";
      this.startGame();
    };
  }

  startGame() {
    this.distance = 0;
    this.coins = 0;
    this.score = 0;
    this.playerZ = 0;
    this.currentLaneIdx = 1;
    this.playerX = 0;
    this.isPlaying = true;
    this.lastTime = performance.now();
    requestAnimationFrame(this.gameLoop.bind(this));
  }

  gameOver() {
    this.isPlaying = false;
    sfx.play(150, 0.6, "sawtooth");
    document.getElementById("start-modal").style.display = "flex";
    document.querySelector("#start-modal h1").innerText = "💥 GAME OVER";
    document.getElementById("btn-start-game").innerText = "PLAY AGAIN";
  }

  gameLoop(t) {
    if (!this.isPlaying) return;
    const dt = Math.min(0.1, (t - this.lastTime) / 1000);
    this.lastTime = t;

    // Move forward
    this.playerZ += this.speed * dt;
    this.distance = Math.floor(this.playerZ);
    this.score = this.distance * 10 + this.coins * 100;

    // Update HUD
    document.getElementById("lbl-distance").innerText = this.distance;
    document.getElementById("lbl-coins").innerText = this.coins;
    document.getElementById("lbl-score").innerText = this.score.toLocaleString();

    // Smooth lane interpolation
    this.targetX = this.lanes[this.currentLaneIdx];
    this.playerX += (this.targetX - this.playerX) * 16 * dt;

    // Jump Physics
    if (this.isJumping) {
      this.jumpY += this.jumpVel * dt;
      this.jumpVel -= 35 * dt; // Gravity
      if (this.jumpY <= 0) {
        this.jumpY = 0;
        this.isJumping = false;
      }
    }

    // Slide Physics
    if (this.isSliding) {
      this.slideTime -= dt;
      this.bodyMesh.scale.set(1, 0.4, 1.4);
      if (this.slideTime <= 0) {
        this.isSliding = false;
        this.bodyMesh.scale.set(1, 1, 1);
      }
    }

    // Update Player & Warden Transform
    this.playerGroup.position.set(this.playerX, this.jumpY, this.playerZ);
    this.wardenMesh.position.set(this.playerX * 0.8, 0, this.playerZ - 10);

    // Camera follow
    this.camera.position.set(this.playerX * 0.4, 4.2 + this.jumpY * 0.3, this.playerZ - 6.5);
    this.camera.lookAt(new THREE.Vector3(this.playerX, 1.5 + this.jumpY, this.playerZ + 8.0));

    // Recycle and Spawn Track Tiles
    const lastTile = this.trackTiles[this.trackTiles.length - 1];
    if (this.playerZ > lastTile.position.z - 150) {
      this.spawnTrackTile(lastTile.position.z + 30);
    }

    // Check Obstacle Collisions
    for (let obs of this.obstacles) {
      if (Math.abs(this.playerZ - obs.position.z) < 1.0 && Math.abs(this.playerX - obs.position.x) < 1.2) {
        if (!this.isSliding && this.jumpY < 1.5) {
          this.gameOver();
          return;
        }
      }
    }

    // Collect Coins
    for (let i = this.coinObjects.length - 1; i >= 0; i--) {
      const coin = this.coinObjects[i];
      coin.rotation.z += 5 * dt;
      if (Math.abs(this.playerZ - coin.position.z) < 1.2 && Math.abs(this.playerX - coin.position.x) < 1.2) {
        this.coins++;
        sfx.play(800, 0.1, "sine");
        this.scene.remove(coin);
        this.coinObjects.splice(i, 1);
      }
    }

    this.renderer.render(this.scene, this.camera);
    requestAnimationFrame(this.gameLoop.bind(this));
  }
}

window.addEventListener("DOMContentLoaded", () => {
  window.game = new RelicRunGame();
});
</script>

</body>
</html>
