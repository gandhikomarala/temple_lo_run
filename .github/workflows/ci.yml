name: Relic Run Continuous Integration

on:
  push:
    branches: [ main, feature/* ]
  pull_request:
    branches: [ main ]

jobs:
  test-backend:
    name: Backend Test Suite & Lint
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest flake8 pydantic fastapi httpx sqlalchemy

      - name: Run Pytest Test Matrix
        run: |
          PYTHONPATH=. pytest Backend/tests/ -v

      - name: Run Demo Engine Probe
        run: |
          PYTHONPATH=. python scripts/demo_run.py
